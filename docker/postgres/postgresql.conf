# =====================================================================
#  postgresql.conf — Sistema de Administración Hotelera
#  Valores ajustados para un servidor pequeño (2 vCPU / 2-4 GB RAM).
#  Parámetros no listados usan su valor por defecto.
# =====================================================================

# --- Conexiones ------------------------------------------------------
listen_addresses        = '*'
port                    = 5432
max_connections         = 100
superuser_reserved_connections = 3
hba_file                = '/etc/postgresql/pg_hba.conf'

# --- Seguridad -------------------------------------------------------
password_encryption     = scram-sha-256
ssl                     = off           # se activa con ALTER SYSTEM en initdb/01_ssl.sh
                                        # una vez generados los certificados
ssl_cert_file           = 'server.crt'
ssl_key_file            = 'server.key'
ssl_min_protocol_version = 'TLSv1.2'

# --- Memoria ---------------------------------------------------------
shared_buffers          = 512MB         # ~25% de la RAM
effective_cache_size    = 1536MB        # ~75% de la RAM
work_mem                = 8MB
maintenance_work_mem    = 128MB

# --- WAL, checkpoints y archivado (respaldos / PITR) -----------------
wal_level               = replica
wal_compression         = lz4
max_wal_size            = 1GB
min_wal_size            = 160MB
checkpoint_timeout      = 10min
checkpoint_completion_target = 0.9
archive_mode            = on
# WAL comprimido con gzip: un segmento de 16 MB casi vacío queda en pocos KB.
# Escritura a .tmp + mv para que nunca exista un archivo a medio copiar.
archive_command         = 'test ! -f /wal_archive/%f.gz && gzip -c %p > /wal_archive/%f.gz.tmp && mv /wal_archive/%f.gz.tmp /wal_archive/%f.gz'
archive_timeout         = 300           # fuerza un segmento cada 5 min (RPO <= 5 min)

# --- Replicación (alta disponibilidad) -------------------------------
max_wal_senders         = 5
max_replication_slots   = 5
wal_keep_size           = 256MB
hot_standby             = on            # la réplica acepta consultas de solo lectura
hot_standby_feedback    = on

# --- Planificador ----------------------------------------------------
random_page_cost        = 1.1           # almacenamiento SSD
effective_io_concurrency = 200
enable_partition_pruning = on

# --- Autovacuum ------------------------------------------------------
autovacuum              = on
autovacuum_max_workers  = 3
autovacuum_naptime      = 30s
autovacuum_vacuum_scale_factor  = 0.1
autovacuum_analyze_scale_factor = 0.05
log_autovacuum_min_duration = 1s

# --- Bitácora del servidor (logs) ------------------------------------
logging_collector       = on
log_directory           = 'log'
log_filename            = 'postgresql-%a.log'   # un archivo por día de la semana
log_truncate_on_rotation = on                   # rotación semanal: máximo 7 archivos
log_rotation_age        = 1d
log_rotation_size       = 0
log_line_prefix         = '%m [%p] %q%u@%d %h '
log_connections         = on
log_disconnections      = on
log_min_duration_statement = 500ms              # consultas lentas
log_lock_waits          = on
log_temp_files          = 0
log_checkpoints         = on
log_statement           = 'ddl'                 # auditoría de cambios estructurales

# --- Estadísticas / monitoreo ----------------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max   = 5000
pg_stat_statements.track = all
track_io_timing          = on
track_functions          = pl

# --- Localización ----------------------------------------------------
timezone                = 'America/El_Salvador'
log_timezone            = 'America/El_Salvador'
datestyle               = 'iso, dmy'
lc_messages             = 'C.UTF-8'
default_text_search_config = 'pg_catalog.spanish'
