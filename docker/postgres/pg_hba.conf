# =====================================================================
#  pg_hba.conf — Control de acceso por red
#  TYPE      DATABASE     USER          ADDRESS        METHOD
# =====================================================================

# Socket local: solo el superusuario del sistema operativo (scripts internos)
local       all          postgres                     peer
local       all          all                          scram-sha-256

# Replicación: solo el rol "replicador", siempre cifrado
hostssl     replication  replicador    all            scram-sha-256

# Aplicación y administración: solo conexiones cifradas con SSL
hostssl     hotel        all           all            scram-sha-256
hostssl     postgres     postgres      all            scram-sha-256

# Cualquier conexión sin SSL o a otra base se rechaza
host        all          all           all            reject
